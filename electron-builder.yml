appId: com.halfspace.app
productName: Halfspace
directories:
  buildResources: build
  output: dist/release
files:
  - out/**
  - package.json
asar: true
forceCodeSigning: true
artifactName: Halfspace-${version}-${arch}.${ext}
publish: null

mac:
  target:
    - dmg
    - zip
  category: public.app-category.sports
  minimumSystemVersion: '13.0'
  icon: build/icon.icns
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true

dmg:
  sign: true
  writeUpdateInfo: false
  title: Halfspace ${version} ${arch}
  contents:
    - x: 130
      y: 150
    - x: 410
      y: 150
      type: link
      path: /Applications
